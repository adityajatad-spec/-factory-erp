name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      NODE_ENV: test
      # Runtime role (created by db:migrate) and schema owner — the same split as production.
      DATABASE_URL: postgres://factoryerp_app:factoryerp_app@127.0.0.1:5432/factoryerp
      DATABASE_OWNER_URL: postgres://factoryerp:factoryerp@127.0.0.1:5432/factoryerp
      TEST_DATABASE_ADMIN_URL: postgres://factoryerp:factoryerp@127.0.0.1:5432/postgres
      # GitHub's Ubuntu runners ship Google Chrome; used for invoice PDFs and the e2e smoke test.
      PDF_BROWSER_EXECUTABLE: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      # The same Compose service as development: the backup tests run pg_dump/pg_restore
      # inside it, so client and server versions always match.
      - name: Start PostgreSQL
        run: pnpm db:up

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm db:migrate

      - name: Generated DB types are up to date
        run: pnpm db:codegen --verify

      - name: Unit + integration tests (real PostgreSQL)
        run: pnpm test

      - name: Build
        run: pnpm build

      # Throwaway database + fresh demo data + the production build; prints server error logs
      # and fails on any. Journeys: smoke, receivables, sales corrections.
      - name: End-to-end journeys (built app, real browser)
        run: pnpm --filter @factory-erp/web e2e
